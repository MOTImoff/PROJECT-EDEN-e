/* =========================================
   PROJECT EDEN:e
   デザイン設定：青緑 / SFアーカイブ
   ========================================= */
:root {
  --bg: #edf5f5;
  --paper: #f8fbfb;
  --teal: #315967;
  --deep: #203f49;
  --accent: #78b8bc;
  --line: #bfd8da;
  --muted: #6b8d94;
  --header-height: 66px;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--teal);
  font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN",
               Meiryo, sans-serif;
  line-height: 1.9;
  letter-spacing: .035em;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; height: auto; }

button, a { -webkit-tap-highlight-color: transparent; }

/* =========================================
   ★ 編集する場所 1：画像
   最初はJimdoの画像URLを設定済み。
   あとで画像を差し替えるときはURLだけ変更！
   ========================================= */
.site-header__logo img {
  content: url("https://image.jimcdn.com/app/cms/image/transf/dimension%3D264x10000%3Aformat%3Dpng/path/sdcb09d6915eee500/image/ia239aed0aa217100/version/1791625823/image.png");
}

.hero__image {
  background-image: url("https://image.jimcdn.com/app/cms/image/transf/dimension%3D377x1024%3Aformat%3Dpng/path/sdcb09d6915eee500/image/i9061e489e08c30aa/version/1791572528/image.png");
}

.title-logo {
  content: url("https://image.jimcdn.com/app/cms/image/transf/dimension%3D264x10000%3Aformat%3Dpng/path/sdcb09d6915eee500/image/ia239aed0aa217100/version/1791625823/image.png");
}

/* =========================================
   固定ヘッダー
   ========================================= */
.site-header {
  position: fixed;
  z-index: 1000;
  inset: 0 0 auto;
  height: var(--header-height);
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: rgba(248, 251, 251, .94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
  box-shadow: 0 3px 18px rgba(32, 63, 73, .06);
}

.site-header__logo {
  display: flex;
  align-items: center;
  min-width: 0;
}

.site-header__logo img {
  display: block;
  width: auto;
  max-width: 190px;
  height: 42px;
  object-fit: contain;
  object-position: left center;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-status {
  font: 10px/1.5 monospace;
  color: var(--muted);
  letter-spacing: .12em;
}

.menu-button {
  width: 43px;
  height: 43px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--teal);
  cursor: pointer;
  display: grid;
  place-content: center;
  gap: 5px;
}

.menu-button span {
  display: block;
  width: 19px;
  height: 1px;
  background: currentColor;
  transition: transform .25s ease;
}

.menu-button[aria-expanded="true"] span:first-child {
  transform: translateY(3px) rotate(45deg);
}

.menu-button[aria-expanded="true"] span:last-child {
  transform: translateY(-3px) rotate(-45deg);
}

/* 右上から開くメニュー */
.site-menu {
  position: fixed;
  z-index: 999;
  top: var(--header-height);
  right: 0;
  width: min(340px, 88vw);
  padding: 22px;
  background: var(--deep);
  color: #edf8f8;
  border-left: 1px solid var(--accent);
  border-bottom: 1px solid var(--accent);
  box-shadow: -8px 12px 30px rgba(20, 49, 58, .18);
  transform: translateY(-8px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s, transform .25s, visibility .25s;
}

.site-menu.is-open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.menu-label {
  margin: 0 0 12px;
  color: #9ed0d2;
  font: 10px monospace;
  letter-spacing: .16em;
}

.site-menu a {
  display: flex;
  justify-content: space-between;
  padding: 12px 4px;
  border-bottom: 1px solid rgba(191, 216, 218, .22);
  font-size: 14px;
}

.site-menu a span {
  color: #9ed0d2;
  font: 10px monospace;
}

/* =========================================
   共通装飾
   ========================================= */
main { padding-top: var(--header-height); }

.section {
  position: relative;
  padding: 76px 7%;
  overflow: hidden;
}

.section-inner {
  width: min(100%, 850px);
  margin-inline: auto;
}

.eyebrow {
  margin: 0 0 9px;
  color: var(--muted);
  font: 11px/1.6 monospace;
  letter-spacing: .17em;
}

.section-title {
  margin: 0 0 24px;
  color: var(--deep);
  font-size: clamp(23px, 5vw, 34px);
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: .08em;
}

.section-title::after {
  content: "";
  display: block;
  width: 56px;
  height: 2px;
  margin-top: 16px;
  background: var(--accent);
}

.section-text {
  max-width: 650px;
  font-size: 14px;
  line-height: 2.2;
}

.corner-frame {
  position: relative;
  border: 1px solid var(--line);
}

.corner-frame::before,
.corner-frame::after {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  pointer-events: none;
}

.corner-frame::before {
  top: -1px;
  left: -1px;
  border-top: 2px solid var(--accent);
  border-left: 2px solid var(--accent);
}

.corner-frame::after {
  right: -1px;
  bottom: -1px;
  border-right: 2px solid var(--accent);
  border-bottom: 2px solid var(--accent);
}

.text-link {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  margin-top: 22px;
  padding: 9px 0;
  border-bottom: 1px solid var(--accent);
  font-size: 12px;
  letter-spacing: .1em;
  transition: gap .2s ease;
}

.text-link:hover { gap: 38px; }

/* =========================================
   メインビジュアル
   ========================================= */
.hero {
  background: var(--deep);
  padding: 0;
}

.hero__image {
  min-height: clamp(340px, 65vw, 650px);
  background-color: #cbdedf;
  background-size: cover;
  background-position: center;
  position: relative;
}

.hero__image::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(0deg, rgba(21, 51, 60, .20), transparent 45%),

      0deg,
      transparent 0,
      transparent 5px,
      rgba(255,255,255,.035) 6px
    );
}

.hero__image::after {
  content: "EDEN PROJECT / INITIALIZING";
  position: absolute;
  left: 5%;
  bottom: 20px;
  color: rgba(255,255,255,.85);
  font: 10px monospace;
  letter-spacing: .16em;
  text-shadow: 0 1px 5px rgba(0,0,0,.3);
}

.hero-caption {
  padding: 34px 20px 38px;
  text-align: center;
  background:
    linear-gradient(135deg, rgba(120,184,188,.12), transparent 50%),
    var(--paper);
  border-bottom: 1px solid var(--line);
}

.title-logo {
  display: block;
  width: min(280px, 75%);
  max-height: 150px;
  object-fit: contain;
  margin: 0 auto 8px;
}

.hero-subtitle {
  margin: 0;
  color: var(--deep);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .28em;
}

.hero-en {
  margin: 7px 0 0;
  color: var(--muted);
  font: 9px monospace;
  letter-spacing: .2em;
}

.scroll-cue {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-top: 25px;
  color: var(--muted);
  font: 9px monospace;
  letter-spacing: .18em;
}

.scroll-cue::before,
.scroll-cue::after {
  content: "";
  display: block;
  width: 26px;
  height: 1px;
  background: var(--line);
}

/* =========================================
   ABOUT
   ========================================= */
.about {
  background:
    radial-gradient(ellipse at 100% 0%, rgba(120,184,188,.13), transparent 45%),
    var(--bg);
}

.info-line {
  display: flex;
  gap: 15px;
  align-items: flex-start;
  margin-top: 25px;
  padding-top: 17px;
  border-top: 1px solid var(--line);
  font: 10px monospace;
  color: var(--muted);
}

.info-line strong {
  color: var(--teal);
  font-weight: 500;
}

/* =========================================
   CHARACTER
   ========================================= */
.character-section {
  background:
    linear-gradient(120deg, rgba(120,184,188,.12), transparent 60%),
    #dfeeee;
}

.character-panel {
  padding: clamp(24px, 5vw, 42px);
  background: var(--deep);
  color: #edf8f8;
  border: 1px solid #6ea6ac;
  box-shadow: 8px 8px 0 rgba(120,184,188,.18);
}

.character-panel .eyebrow { color: #9ed0d2; }
.character-panel .section-title { color: #f5fbfb; }
.character-panel .section-title::after { background: #9ed0d2; }
.character-panel .section-text { color: #d0e5e6; }
.character-panel .text-link { border-color: #9ed0d2; }

/* =========================================
   NEWS
   ========================================= */
.news {
  background: var(--paper);
}

  display: grid;

}

.news-date {
  color: var(--muted);

}

.news-title {
  margin: 0;

  font-weight: 600;
}

.news-description {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

/* =========================================
   WORLD
   ========================================= */
.world {
  background:
    linear-gradient(rgba(237,245,245,.92), rgba(237,245,245,.96)),

.world-quote {
  padding: 28px 18px;

  font-weight: 600;
  line-height: 2;
  letter-spacing: .1em;
}
